version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - yarn install --frozen-lockfile
            # - echo "NEXT_PUBLIC_FACEBOOK_PIXEL_ID=$NEXT_PUBLIC_FACEBOOK_PIXEL_ID" > .env.production
            # - echo "NEXT_PUBLIC_META_CAPI_PIXEL_ID=$META_CAPI_PIXEL_ID" >> .env.production
            # - echo "NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL" >> .env.production
            # - echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" >> .env.production
            # - echo "META_CAPI_PIXEL_ID=$META_CAPI_PIXEL_ID" >> .env.production
            # - echo "META_CONVERSIONS_API_TOKEN=$META_CONVERSIONS_API_TOKEN" >> .env.production
            # - echo "META_CAPI_ENABLE_TEST_EVENTS=$META_CAPI_ENABLE_TEST_EVENTS" >> .env.production
            # - echo "META_TEST_EVENT_CODE=$META_TEST_EVENT_CODE" >> .env.production
        build:
          commands:
            - yarn build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
