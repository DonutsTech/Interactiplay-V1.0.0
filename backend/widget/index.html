<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InteractiPlay Widget</title>
  </head>
  <body>
  <script>
    let config = {};

    try {
      config = JSON.parse(window.name);
    } catch (e) {
      console.error("Config inválida no name");
    }

    const hasCampaign = config.campaign && config.campaign.length > 0;
    const hasTestab = config.testab && config.testab.length > 0;

    if (hasCampaign || hasTestab) {

      const app = document.createElement("div");
      app.setAttribute("interactiplay", "");

      if (hasCampaign) {
        app.dataset.campaign = config.campaign;
      }

      if (hasTestab) {
        app.dataset.testab = config.testab;
      }

      if (config.style) {
        app.style = config.style;
      }

      document.body.appendChild(app);

      const script = document.createElement("script");
      script.type = "module";
      script.src = "index.mjs";
      script.crossOrigin = "anonymous";
      document.body.appendChild(script);
    } else {
      console.warn("campaign/testab ausente ou inválido. Widget não carregado.");
    }
  </script>
</body>
</html>
