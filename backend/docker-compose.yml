services:
  db:
    build: ./backend/.docker/postgres
    container_name: db
    restart: always
    tty: true
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    env_file:
      - ./backend/.env
    networks:
      - interact-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    container_name: backend
    working_dir: /api
    restart: always
    volumes:
      - ./backend:/api
      - backend_node_modules:/api/node_modules
    tty: true
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - interact-network

  nginx:
    container_name: nginx
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - interact-network
    volumes:
      - ./nginx/nginx-selfsigned.crt:/etc/ssl/certs/nginx-selfsigned.crt:ro
      - ./nginx/nginx-selfsigned.key:/etc/ssl/private/nginx-selfsigned.key:ro
      - ./nginx/default.config:/etc/nginx/conf.d/default.conf:ro

  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: stripe-cli
    env_file:
      - ./backend/.env
    command: listen --forward-to http://backend:4000/data/webhook
    depends_on:
      - backend
      - nginx
    volumes:
      - ./backend/stripe-config:/root/.config/stripe
    networks:
      - interact-network
    restart: unless-stopped

networks:
  interact-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  backend_node_modules:
    driver: local
