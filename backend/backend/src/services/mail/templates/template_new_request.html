<div
  style="
    background-color: #e4e4e4;
    border-left: 5px solid #231183;
    padding: 20px;
    margin: 30px auto;
    max-width: 450px;
    text-align: left;
    border-radius: 4px;
  "
>
  <p style="margin: 0; color: #060664; font-size: 14px">
    Tipo da solicitação:
  </p>

  <p
    style="
      margin: 5px 0 15px;
      color: #231183;
      font-size: 18px;
      font-weight: bold;
    "
  >
    {{type}}
  </p>

  <p style="margin: 0; color: #060664; font-size: 14px">
    Nome do cliente:
  </p>

  <p
    style="
      margin: 5px 0 15px;
      color: #231183;
      font-size: 16px;
      font-weight: bold;
    "
  >
    {{name}}
  </p>

  <p style="margin: 0; color: #060664; font-size: 14px">
    E-mail:
  </p>

  <p
    style="
      margin: 5px 0 15px;
      color: #231183;
      font-size: 16px;
      font-weight: bold;
    "
  >
    {{email}}
  </p>

  <p style="margin: 0; color: #060664; font-size: 14px">
    WhatsApp:
  </p>

  <p
    style="
      margin: 5px 0 15px;
      color: #231183;
      font-size: 16px;
      font-weight: bold;
    "
  >
    {{whatsapp}}
  </p>

  <p style="margin: 0; color: #060664; font-size: 14px">
    Mensagem:
  </p>

  <p
    style="
      margin-top: 8px;
      color: #060664;
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-line;
    "
  >
    {{message}}
  </p>
</div>
