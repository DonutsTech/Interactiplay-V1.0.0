<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solicitação Recebida</title>
  </head>

  <body style="margin: 0; padding: 0; font-family: sans-serif; background-color: #eeeeee">
    <div
      style="
        background-color: #f2f2f2;
        max-width: 600px;
        margin: 20px auto;
        padding: 30px 30px 14px 30px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      "
    >
      <div style="text-align: center; padding-bottom: 25px; border-bottom: 1px solid #e4e4e4">
        <h1 style="color: #060664; font-size: 28px; font-weight: bold; margin: 0">
          <img
            src="https://interacti-uploads.s3.us-east-1.amazonaws.com/uploads/images/logo_in.svg"
            alt="Logo InteractiPlay"
            style="height: 50px"
          />
        </h1>
      </div>

      <div style="text-align: center">
        <h2 style="color: #060664; font-size: 24px; font-weight: bold; margin-bottom: 20px">
          Sua solicitação foi enviada!
        </h2>

        <p
          style="
            color: #060664;
            font-size: 16px;
            line-height: 1.6;
            max-width: 500px;
            margin: 0 auto 20px;
          "
        >
          Recebemos sua mensagem com sucesso. Nossa equipe irá analisar sua solicitação e, caso
          necessário, entraremos em contato em breve.
        </p>

        <div
          style="
            background-color: #e4e4e4;
            border-left: 5px solid #231183;
            padding: 15px 20px;
            margin: 30px auto;
            max-width: 400px;
            text-align: left;
            border-radius: 4px;
          "
        >
          <p style="color: #060664; font-size: 14px; margin: 0">Tipo da solicitação:</p>

          <p style="font-size: 18px; font-weight: bold; color: #231183; margin: 5px 0 15px">
            {{type}}
          </p>

          <p style="color: #060664; font-size: 14px; margin: 0">E-mail enviado por:</p>

          <p style="font-size: 16px; font-weight: bold; color: #231183; margin: 5px 0 0">
            {{email}}
          </p>
        </div>

        <p
          style="
            color: #9c9c9c;
            font-size: 12px;
            line-height: 1.5;
            margin-top: 40px;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
          "
        >
          Este é um e-mail automático. Não é necessário respondê-lo.
        </p>
      </div>

      <div style="width: 100%; text-align: center">
        <hr style="border: none; border-top: 1px solid #e4e4e4" />

        <p>InteractiPlay</p>
      </div>
    </div>
  </body>
</html>
