<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contato</title>
  </head>
  <body style="margin: 0; padding: 0; font-family: sans-serif; background-color: #eeeeee">
    <div
      style="
        background-color: #f2f2f2;
        max-width: 600px;
        margin: 20px auto;
        padding: 30px 30px 14px 30px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      "
    >
      <div style="text-align: center; padding-bottom: 25px; border-bottom: 1px solid #e4e4e4">
        <h1 style="color: #060664; font-size: 28px; font-weight: bold; margin: 0">
          <img src="https://interacti-uploads.s3.us-east-1.amazonaws.com/uploads/images/logo_in.svg" alt="Logo InteractiPlay" style="height: 50px" />
        </h1>
      </div>

      <div style="text-align: center; padding: 30px 0">
        <h2 style="color: #060664; font-size: 24px; font-weight: bold; margin-bottom: 20px">
          Solicitação de contato recebida
        </h2>

        <div
  style="
    background-color: #e4e4e4;
    border-left: 5px solid #231183;
    padding: 20px;
    margin: 30px auto;
    max-width: 450px;
    text-align: left;
    border-radius: 4px;
  "
>
  <p style="margin: 0; color: #060664; font-size: 14px">
    Tipo da solicitação:
  </p>

  <p
    style="
      margin: 5px 0 15px;
      color: #231183;
      font-size: 12px;
      font-weight: 500;
    "
  >
    {{type}}
  </p>

  <p style="margin: 0; color: #060664; font-size: 14px">
    Nome do cliente:
  </p>

  <p
    style="
      margin: 5px 0 15px;
       color: #231183;
      font-size: 12px;
      font-weight: 500;
    "
  >
    {{name}}
  </p>

  <p style="margin: 0; color: #060664; font-size: 14px">
    E-mail:
  </p>

  <p
    style="
      margin: 5px 0 15px;
      color: #231183;
      font-size: 12px;
      font-weight: 500;
    "
  >
    {{email}}
  </p>

  <p style="margin: 0; color: #060664; font-size: 14px">
    WhatsApp:
  </p>

  <p
    style="
      margin: 5px 0 15px;
      color: #231183;
      font-size: 12px;
      font-weight: 500;
    "
  >
    {{phone}}
  </p>

  <p style="margin: 0; color: #060664; font-size: 14px">
    Mensagem:
  </p>

  <p
    style="
      margin-top: 8px;
      color: #060664;
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-line;
    "
  >
    {{message}}
  </p>
</div>
      </div>
      <div style="width: 100%; text-align: center">
        <hr style="border: none; border-top: 1px solid #e4e4e4" />
        <p>InteractiPlay - Sua plataforma de videos VSL</p>
      </div>
    </div>
  </body>
</html>
